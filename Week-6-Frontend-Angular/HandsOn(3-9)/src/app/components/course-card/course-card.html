<div [ngClass]="cardClasses" 
     [ngStyle]="{'border-left': '6px solid ' + (course.gradeStatus === 'passed' ? 'green' : course.gradeStatus === 'failed' ? 'red' : 'grey')}"
     style="padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
  
  <h3>{{ course.name }} ({{ course.code }})</h3>
  <p>{{ course.credits | creditLabel }}</p>

  <div [ngSwitch]="course.gradeStatus" style="margin-bottom: 10px;">
    <span *ngSwitchCase="'passed'" style="color: green; font-weight: bold;">Passed</span>
    <span *ngSwitchCase="'failed'" style="color: red; font-weight: bold;">Failed</span>
    <span *ngSwitchDefault style="color: grey; font-weight: bold;">Pending</span>
  </div>

  <button (click)="toggleExpand()">{{ isExpanded ? 'Hide Details' : 'Show Details' }}</button>
  <button (click)="toggleEnroll()" style="margin-left: 10px;">
    {{ enrollmentService.isEnrolled(course.id) ? 'Unenroll' : 'Enroll' }}
  </button>
</div>
